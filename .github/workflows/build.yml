name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - release
    tags:
      - 'v*'
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Separate supported native Intel and Apple Silicon runners.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    env:
      # Supported released CPython versions as of September 2026, plus current PyPy.
      # Python 3.10 remains in security support until October 2026.
      CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-* pp311-*'
      CIBW_ENABLE: pypy
      # Free-threaded Python requires a separate extension/thread-safety audit.
      CIBW_SKIP: 'cp3??t-*'
      # These architectures remain supported by cibuildwheel 3.
      # s390x remains excluded because tests fail (see cbits/webrtc/typedefs.h).
      CIBW_ARCHS_LINUX: x86_64 i686 aarch64 ppc64le
      CIBW_ARCHS_WINDOWS: AMD64 x86
      CIBW_ARCHS_MACOS: native
      # manylinux2014 remains maintained and provides a glibc 2.17 baseline.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_I686_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      CIBW_MANYLINUX_PPC64LE_IMAGE: manylinux2014
      CIBW_MANYLINUX_PYPY_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_PYPY_I686_IMAGE: manylinux2014
      CIBW_MANYLINUX_PYPY_AARCH64_IMAGE: manylinux2014
      CIBW_TEST_COMMAND: python {project}/test_webrtcvad.py
      CIBW_TEST_EXTRAS: dev

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build and test source distribution on Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Test installed sdist with packaged fixtures
        run: |
          python -m pip install dist/*.tar.gz psutil
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          python sdist-test/test_webrtcvad.py

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  validate_artifacts:
    name: Validate downloaded distribution artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          # Match the publishing job's extraction layout without publishing.
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Check flattened wheels and source distribution
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          files = list(dist.iterdir())
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert wheels, "No wheels downloaded"
          assert len(sdists) == 1, f"Expected one sdist, found {len(sdists)}"
          assert all(path.is_file() for path in files), "Artifacts must be flattened into dist/"
          assert len(files) == len(wheels) + len(sdists), "Unexpected distribution files"
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  assert archive.testzip() is None, f"Corrupt wheel: {wheel}"
                  assert any(name.endswith(".dist-info/METADATA") for name in archive.namelist())
          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/test_webrtcvad.py") for name in names)
              assert any(name.endswith("/test-audio.raw") for name in names)
          print(f"Validated {len(wheels)} wheels and {len(sdists)} sdist in flat dist/ layout")

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # or, either of the above
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/download-artifact@v7
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   repository-url: https://test.pypi.org/legacy/
