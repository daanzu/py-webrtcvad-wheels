name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - release
    tags:
      - 'v*'
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build ${{ matrix.build }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
        build: ['cp3*']
        legacy: [false]
        include:
          # cibuildwheel 3 no longer supports CPython 3.6/3.7 or old PyPy.
          # Keep these wheels on the maintained 2.x builder.
          - os: ubuntu-latest
            build: 'cp36-* cp37-* pp37-* pp38-* pp39-* pp310-*'
            legacy: true
          - os: windows-latest
            build: 'cp36-* cp37-* pp37-* pp38-* pp39-* pp310-*'
            legacy: true
          - os: macos-15-intel
            build: 'cp36-* cp37-* pp37-* pp38-* pp39-* pp310-*'
            legacy: true
    env:
      CIBW_BUILD: ${{ matrix.build }}
      # Free-threaded Python requires a separate extension/thread-safety audit.
      CIBW_SKIP: 'cp3??t-*'
      # Keep the old architecture coverage explicit; cibuildwheel 3 changed auto.
      # s390x remains excluded because tests fail (see cbits/webrtc/typedefs.h).
      CIBW_ARCHS_LINUX: x86_64 i686 aarch64 ppc64le
      CIBW_ARCHS_WINDOWS: AMD64 x86
      # Build natively on separate Intel and Apple Silicon runners.
      CIBW_ARCHS_MACOS: native
      # Preserve the glibc 2.17 baseline instead of the new manylinux_2_28 default.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_I686_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      CIBW_MANYLINUX_PPC64LE_IMAGE: manylinux2014
      CIBW_TEST_COMMAND: python {project}/test_webrtcvad.py
      CIBW_TEST_EXTRAS: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker for the legacy builder
        if: runner.os == 'Linux' && matrix.legacy
        uses: docker/setup-docker-action@v5
        with:
          # cibuildwheel 2.x cannot parse Docker 29's version response.
          version: v28.5.2

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build current CPython wheels
        if: ${{ !matrix.legacy }}
        uses: pypa/cibuildwheel@v3.3.1

      - name: Build legacy CPython and PyPy wheels
        if: matrix.legacy
        uses: pypa/cibuildwheel@v2.23.4

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build and test source distribution on Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Test installed sdist with packaged fixtures
        run: |
          python -m pip install dist/*.tar.gz psutil
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          python sdist-test/test_webrtcvad.py

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # or, either of the above
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   repository-url: https://test.pypi.org/legacy/
